services:
  - type: web
    name: reveriestars-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: SUPPORT_USERNAME
        value: neponuma
      - key: DB_PATH
        value: /var/data/reveriestars.db
      - key: PYTHON_VERSION
        value: 3.12.8
    disk:
      name: reveriestars-data
      mountPath: /var/data
      sizeGB: 1
